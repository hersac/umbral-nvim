name: Auto Tag

# Cuando se mezclan cambios a main, lee la versión del archivo VERSION,
# crea el tag vX.Y.Z correspondiente (si no existe) y crea la
# release. El push del tag dispara el workflow `Release`
# (.github/workflows/release.yml) que empaqueta el código fuente
# (.zip + .tar.gz) y lo sube a la release.
#
# La versión sigue la versión del lenguaje Umbral soportada
# (v1.2.5, v1.3.6, v1.4.0, ...): para publicar, el PR debe actualizar VERSION
# y al mezclarse a main se genera el tag y la release automáticamente.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-tag-main
  cancel-in-progress: false

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (con tags e historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Leer versión del archivo VERSION
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION inválida: '$VERSION' (se espera X.Y.Z)"
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Versión detectada: ${VERSION} -> tag ${TAG}"

      - name: Crear tag y release si no existen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git fetch --tags origin

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "El tag $TAG ya existe, no se crea nada."
          else
            echo "Creando tag $TAG..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG ya existe."
          else
            echo "Creando release $TAG..."
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --target "${GITHUB_SHA}"
          fi
